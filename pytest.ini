[pytest]
# Вывод тестов перехватывается подменой sys.stdout / sys.stderr, а не дескрипторов 0–2 (задача R1.3).
# Перехват дескрипторов (--capture=fd, умолчание pytest) на каждой паузе и возобновлении делает dup2 на 0–2;
# на Windows это закрывает прежние описатели ОС стандартных потоков и ставит новые (SetStdHandle). Tcl берёт
# эти описатели стандартными каналами один раз на поток и держит до конца процесса; закрытый описатель
# Windows отдаёт следующему открытому файлу, и очередное окно Tk не читает init.tcl, tk.tcl или auto.tcl.
addopts = --capture=sys
